<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Video Surveillance</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-safe: #10b981;
            --accent-danger: #ef4444;
            --accent-primary: #3b82f6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.1), transparent 25%);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem 2rem;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
            flex: 1;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .video-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 4/3;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--accent-safe);
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--accent-safe);
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .stats-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            background: rgba(30, 41, 59, 0.9);
            transform: translateY(-2px);
        }

        .stat-title {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 700;
            line-height: 1;
        }

        .status-badge {
            display: inline-block;
            margin-top: 1rem;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .status-safe {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-safe);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-danger {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: danger-pulse 1.5s infinite;
        }

        .upload-section {
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
        }

        .upload-section h3 {
            margin: 0 0 1rem 0;
            font-size: 1rem;
            color: var(--text-primary);
        }

        .btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 0.5rem;
        }

        .btn:hover {
            background: #2563eb;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.1);
        }

        .file-input {
            display: none;
        }

        .model-info {
            margin-top: auto;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
        }

        .loader {
            display: none;
            margin: 10px auto;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid var(--accent-primary);
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    {% csrf_token %}
    <header class="header">
        <h1>Smart Video Surveillance</h1>
        <p>Real-Time Threat & Person Detection Dashboard</p>
    </header>

    <main class="container">
        <!-- Video Feed Section -->
        <section class="glass-panel video-container">
            <div class="video-header">
                <h2 style="margin:0; font-size: 1.5rem; font-weight: 600;">Live Feed</h2>
                <div class="live-badge" id="source-badge">
                    <div class="pulse"></div>
                    <span id="source-name">CAMERA 01 (Webcam)</span>
                </div>
            </div>
            <div class="video-wrapper">
                <img src="{% url 'video_feed' %}" alt="Live Video Feed" class="video-feed" id="video-stream">
            </div>
        </section>

        <!-- Stats Section -->
        <section class="glass-panel stats-container">
            
            <div class="upload-section">
                <h3>Change Source</h3>
                <button class="btn" onclick="document.getElementById('file-upload').click()">Upload Image / Video</button>
                <input type="file" id="file-upload" class="file-input" accept="image/*,video/*" onchange="uploadFile(this)">
                
                <button class="btn btn-outline" onclick="switchToWebcam()">Switch to Webcam</button>
                <div class="loader" id="upload-loader"></div>
            </div>

            <div class="stat-card">
                <div class="stat-title">System Status</div>
                <div class="status-badge status-safe" id="status-indicator">SAFE</div>
            </div>

            <div class="stat-card">
                <div class="stat-title">Persons Detected</div>
                <div class="stat-value" id="person-count">0</div>
            </div>

            <div class="model-info">
                <strong>Model:</strong> YOLO11 Nano (CPU Optimized)<br>
                <strong>Engine:</strong> Ultralytics + OpenCV<br>
                <strong>Latency:</strong> Optimizing for i3 CPU
            </div>
        </section>
    </main>

    <script>
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        // Poll the server for updated statistics every 1 second
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Update person count
                    document.getElementById('person-count').innerText = data.person_count;
                    
                    // Update status badge
                    const statusIndicator = document.getElementById('status-indicator');
                    if (data.status === "THREAT DETECTED") {
                        statusIndicator.innerText = "THREAT DETECTED";
                        statusIndicator.className = "status-badge status-danger";
                    } else {
                        statusIndicator.innerText = "SAFE";
                        statusIndicator.className = "status-badge status-safe";
                    }
                    
                    // Update source name
                    document.getElementById('source-name').innerText = data.source_name;
                    
                    // Toggle pulse based on source (webcam vs file)
                    const pulse = document.querySelector('.pulse');
                    if (data.source_name.includes('Webcam')) {
                        pulse.style.display = 'block';
                    } else {
                        pulse.style.display = 'none';
                    }
                }
            } catch (error) {
                console.error("Error fetching stats:", error);
            }
        }

        async function switchToWebcam() {
            document.getElementById('upload-loader').style.display = 'block';
            try {
                let formData = new FormData();
                formData.append('source_type', 'webcam');
                
                await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrfToken },
                    body: formData
                });
            } catch (e) {
                console.error(e);
            }
            document.getElementById('upload-loader').style.display = 'none';
        }

        async function uploadFile(input) {
            if (!input.files || input.files.length === 0) return;
            
            document.getElementById('upload-loader').style.display = 'block';
            try {
                let formData = new FormData();
                formData.append('file', input.files[0]);
                
                await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrfToken },
                    body: formData
                });
            } catch (e) {
                console.error(e);
            }
            document.getElementById('upload-loader').style.display = 'none';
            input.value = ''; // Reset input
        }

        // Start polling
        setInterval(fetchStats, 1000);
    </script>
</body>
</html>
