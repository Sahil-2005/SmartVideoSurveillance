<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CCTV - Operator Authentication</title>
    <!-- Modern Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-canvas: #f0f4f9;
            --bg-card: #ffffff;
            --border-card: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --primary-blue: #1d6ff2;
            --primary-blue-gradient: linear-gradient(135deg, #1d6ff2 0%, #2563eb 100%);
            --primary-blue-light: #eff6ff;
            --primary-blue-border: #bfdbfe;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Outfit', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-canvas);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(29, 111, 242, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 10% 85%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                linear-gradient(rgba(226, 232, 240, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(226, 232, 240, 0.5) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            color: var(--text-body);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 3rem 2.8rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.1), 0 0 1px rgba(15, 23, 42, 0.15);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-logo {
            width: 58px;
            height: 58px;
            background: var(--primary-blue-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem;
            color: #ffffff;
            font-size: 1.8rem;
            box-shadow: 0 8px 24px rgba(29, 111, 242, 0.35);
        }

        .login-card h2 {
            font-family: var(--font-display);
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--text-heading);
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .login-card p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            margin-bottom: 1.4rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 1.3rem;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px 11px 42px;
            background: #ffffff;
            border: 1px solid var(--border-card);
            border-radius: 12px;
            color: var(--text-heading);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s;
            font-family: var(--font-body);
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(29, 111, 242, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue-gradient);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 18px rgba(29, 111, 242, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(29, 111, 242, 0.45);
        }

        .security-badge {
            margin-top: 2rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--border-card);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-green);
        }

        .status-dot-pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <!-- Logo -->
        <div class="login-logo">
            <i class="fa-solid fa-shield-halved"></i>
        </div>

        <h2>Smart CCTV</h2>
        <p class="subtitle">Surveillance System &bull; Secure Portal Login</p>

        {% if error %}
        <div class="error-message">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Operator Username</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Security Passcode</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Authenticate & Enter
            </button>
        </form>

        <div class="security-badge">
            <span class="status-dot-pulse"></span> All Systems Online &bull; 256-bit Encrypted Session
        </div>
    </div>
</body>
</html>
